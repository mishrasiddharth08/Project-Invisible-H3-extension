  <rect x="430" y="480" width="302" height="72" rx="10" fill="#30383d"/>
  <text x="452" y="509" fill="#9cadb0" font-family="system-ui,sans-serif" font-size="13">MODEL FILES</text>
  <text x="452" y="536" fill="#fff" font-family="system-ui,sans-serif" font-size="17">Use local H3 files</text>
  <rect x="756" y="480" width="338" height="72" rx="10" fill="#30383d"/>
